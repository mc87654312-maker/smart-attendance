<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Attendance Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Smart Attendance Dashboard</h1>

        <p class="subtitle">
            Student Attendance Management System
        </p>

        <!-- Statistics -->
        <div class="cards">

            <div class="card">
                <h3>Students</h3>
                <p id="studentCount">0</p>
            </div>

            <div class="card">
                <h3>Subjects</h3>
                <p id="subjectCount">0</p>
            </div>

            <div class="card">
                <h3>Attendance Records</h3>
                <p id="attendanceCount">0</p>
            </div>

        </div>


        <!-- Student Report -->

        <div class="report">

            <h2>Student Attendance Report</h2>

            <label for="studentId">
                Enter Student ID:
            </label>

            <input
                type="number"
                id="studentId"
                value="1"
            >

            <button onclick="getReport()">
                View Report
            </button>

            <div id="reportResult"></div>

        </div>


        <!-- Attendance Analysis -->

        <div class="analysis">

            <h2>Attendance Analysis</h2>

            <div id="analysisResult">
                Enter a Student ID and view the report.
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
